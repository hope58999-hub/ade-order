<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日金言美句</title>
    <style>
        /* 基礎樣式與唯美漸層背景 */
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 毛玻璃效果的卡片 */
        .quote-container {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 3rem 2rem;
            width: 85%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            transition: transform 0.3s ease;
        }

        .quote-container:hover {
            transform: translateY(-5px);
        }

        /* 金句內文 */
        .quote-text {
            font-size: 1.6rem;
            color: #2c3e50;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            font-weight: 500;
            word-wrap: break-word;
        }

        /* 作者/出處 */
        .quote-author {
            font-size: 1.1rem;
            color: #57606f;
            margin-bottom: 2.5rem;
            font-style: italic;
        }

        /* 互動按鈕 */
        .btn-next {
            background-color: #ffffff;
            color: #4a69bd;
            border: none;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .btn-next:hover {
            background-color: #4a69bd;
            color: #ffffff;
            box-shadow: 0 6px 20px rgba(74, 105, 189, 0.3);
        }

        .btn-next:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="quote-container">
        <!-- 金句顯示區域 -->
        <div class="quote-text" id="quote-box">載入中...</div>
        <div class="quote-author" id="author-box"></div>
        
        <!-- 按鈕 -->
        <button class="btn-next" onclick="getRandomQuote()">下一句</button>
    </div>

    <script>
        // 1. 在這裡準備您的金言美句資料庫（可自行自由增刪）
        const quotesData = [
            { text: "當你真心渴望某樣東西時，整個宇宙都會聯合起來幫助你完成。", author: "—— 《牧羊少年奇幻之旅》" },
            { text: "生活不是等待暴風雨過去，而是學會在雨中跳舞。", author: "—— 薇薇安·格林" },
            { text: "生命中最難的階段不是沒有人懂你，而是你不懂你自己。", author: "—— 尼采" },
            { text: "成功並非終點，失敗也非末日，重要的是繼續前行的勇氣。", author: "—— 溫斯頓·邱吉爾" },
            { text: "種一棵樹最好的時間是十年前，其次是現在。", author: "—— 諺語" },
            { text: "願你出走半生，歸來仍是少年。", author: "—— 蘇軾（意境延伸）" },
            { text: "不要因為走得太遠，以至於忘了自己為什麼出發。", author: "—— 紀伯倫" }
        ];

        // 2. 隨機撈取金句的 JavaScript 邏輯
        function getRandomQuote() {
            // 隨機產生陣列索引
            const randomIndex = Math.floor(Math.random() * quotesData.length);
            const selectedQuote = quotesData[randomIndex];
            
            // 將內容寫入網頁
            document.getElementById("quote-box").innerText = selectedQuote.text;
            document.getElementById("author-box").innerText = selectedQuote.selectedQuote ?? selectedQuote.author;
        }

        // 3. 網頁一打開（每次進入）就執行一次
        window.onload = getRandomQuote;
    </script>
</body>
</html>
